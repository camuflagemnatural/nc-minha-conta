<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha conta · Natural Camouflage</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nc-core/css/core.css?v=2">
<script src="/nc-core/js/core.js?v=2"></script></head><body>
<main>
<style>
.ac{max-width:440px;margin:8px auto 0;padding:24px;display:grid;gap:14px}
.ac h2{font-size:18px}.ac form{display:grid;gap:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border:1px solid var(--line);border-radius:14px}
.tabs button{padding:10px;border:0;border-radius:10px;background:none;color:var(--mut);font:700 14px 'DM Sans';cursor:pointer}
.tabs button[aria-selected=true]{background:var(--bone);color:var(--ink)}
.lnk{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0;justify-self:start}
.ok{color:var(--ok);font-size:13px;min-height:18px}
.dash{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.dash nav{display:grid;gap:4px}
.dash nav button{text-align:left;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--mut);font:700 14px 'DM Sans';cursor:pointer}
.dash nav button[aria-current]{background:var(--bone);color:var(--ink)}
.pn{padding:20px;display:grid;gap:12px}.pn h2{font-size:16px}
.ro{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.ro:last-child{border:0}.ro .tp{display:flex;justify-content:space-between;gap:10px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.bd.g{color:var(--ok);border-color:var(--ok)}
@media(max-width:760px){.dash{grid-template-columns:1fr}.dash nav{display:flex;overflow-x:auto}.dash nav button{white-space:nowrap}}
</style>
<div id="app"></div>
</main>
<script>
const {$,$$,esc,brl,url,toast,R,orders,auth}=NC;
const app=$('#app');
const msg=(el,t,ok)=>{el.className=ok?'ok':'err';el.textContent=t||''};
const busy=async(btn,er,fn)=>{const t=btn.textContent;btn.disabled=true;btn.textContent='Aguarde…';msg(er,'');
 const slow=setTimeout(()=>msg(er,'Acordando o servidor, pode levar até 1 minuto…',true),4000);
 try{await fn()}catch(e){msg(er,e.message)}finally{clearTimeout(slow);btn.disabled=false;btn.textContent=t}};
const pw=(id,label,ac)=>`<div><label for="${id}">${label}</label><input id="${id}" type="password" autocomplete="${ac}" minlength="8" maxlength="128" required></div>`;

/* ---------- visitante ---------- */
function guest(mode='in'){
 const tabs=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='in'}" data-m="in">Entrar</button><button role="tab" aria-selected="${mode==='up'}" data-m="up">Criar conta</button></div>`;
 let body='';
 if(mode==='in')body=`<form id="fi"><div><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required></div>${pw('p','Senha','current-password')}<div id="er" class="err" role="alert"></div><button class="btn full" type="submit">Entrar</button><button class="lnk" type="button" id="fg">Esqueci minha senha</button></form>`;
 if(mode==='up')body=`<form id="fu"><div><label for="n">Nome</label><input id="n" autocomplete="name" minlength="2" required></div><div><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required></div><div><label for="t">Telefone (opcional)</label><input id="t" type="tel" autocomplete="tel" inputmode="tel"></div>${pw('p','Senha (mínimo 8 caracteres)','new-password')}<div id="er" class="err" role="alert"></div><button class="btn full" type="submit">Criar conta</button></form>`;
 if(mode==='fg')body=`<form id="ff"><p class="sub" style="margin:0">Informe seu e-mail. Se ele estiver cadastrado, você recebe o link para criar uma nova senha.</p><div><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" required></div><div id="er" class="err" role="alert"></div><button class="btn full" type="submit">Enviar link</button><button class="lnk" type="button" id="bk">Voltar</button></form>`;
 app.innerHTML=`<h1 class="ttl" style="text-align:center">${mode==='fg'?'Recuperar senha':'Minha conta'}</h1><p class="sub" style="text-align:center">Acompanhe pedidos e salve endereços para comprar mais rápido.</p><div class="card ac">${mode==='fg'?'':tabs}${body}</div>`;
 $$('.tabs button').forEach(b=>b.onclick=()=>guest(b.dataset.m));
 const er=$('#er');
 if($('#fg'))$('#fg').onclick=()=>guest('fg');if($('#bk'))$('#bk').onclick=()=>guest('in');
 if($('#fi'))$('#fi').onsubmit=e=>{e.preventDefault();busy(e.submitter||$('#fi button'),er,async()=>{await auth.login($('#e').value,$('#p').value);toast('Bem-vindo de volta!');home()})};
 if($('#fu'))$('#fu').onsubmit=e=>{e.preventDefault();busy(e.submitter||$('#fu button'),er,async()=>{await auth.register({name:$('#n').value.trim(),email:$('#e').value,password:$('#p').value,phone:$('#t').value.trim()||undefined});toast('Conta criada!');home()})};
 if($('#ff'))$('#ff').onsubmit=e=>{e.preventDefault();busy(e.submitter||$('#ff button'),er,async()=>{const d=await auth.forgot($('#e').value);msg(er,d.message||'Verifique seu e-mail.',true)})};
}

/* ---------- redefinir senha (link do e-mail) ---------- */
function reset(token){
 app.innerHTML=`<h1 class="ttl" style="text-align:center">Nova senha</h1><div class="card ac"><form id="fr">${pw('p','Nova senha (mínimo 8 caracteres)','new-password')}<div id="er" class="err" role="alert"></div><button class="btn full" type="submit">Salvar nova senha</button></form></div>`;
 $('#fr').onsubmit=e=>{e.preventDefault();busy($('#fr button'),$('#er'),async()=>{await auth.reset(token,$('#p').value);history.replaceState(null,'',R.conta);toast('Senha alterada. Faça login.');guest('in')})};
}

/* ---------- área do cliente ---------- */
const STATUS_OK=['paid','preparing','shipped','delivered'];
const VIEWS={
 async pedidos(box){
  box.innerHTML='<div class="empty">Carregando pedidos…</div>';
  let list=[];try{list=(await auth.call('/api/me/orders')).orders}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const codes=new Set(list.map(o=>o.code));
  const local=orders.all().filter(o=>!codes.has(o.id));
  const row=o=>`<a class="ro" href="${url('rastreio',{pedido:o.code})}"><div class="tp"><b>${esc(o.code)}</b><b>${brl(o.totalCents)}</b></div><div class="tp"><span style="color:var(--mut)">${new Date(o.createdAt).toLocaleDateString('pt-BR')} · ${o.items.map(i=>esc(i.name)+' '+esc(i.size)+' ×'+i.qty).join(', ')}</span><span class="bd${STATUS_OK.includes(o.status)?' g':''}">${esc(o.statusLabel||o.status)}</span></div>${o.trackingCode?`<small style="color:var(--mut)">${esc(o.carrier||'Rastreio')}: ${esc(o.trackingCode)}</small>`:''}</a>`;
  const lrow=o=>`<a class="ro" href="${url('rastreio',{pedido:o.id})}"><div class="tp"><b>${esc(o.id)}</b><b>${brl(o.total)}</b></div><span style="color:var(--mut)">${new Date(o.date).toLocaleDateString('pt-BR')} · feito sem login</span></a>`;
  box.innerHTML=(list.length||local.length)?list.map(row).join('')+(local.length?`<h3 style="font-size:13px;margin:14px 0 0;color:var(--mut)">Neste aparelho</h3>`+local.map(lrow).join(''):''):`<div class="empty">Nenhum pedido ainda.<br><a class="btn" href="${R.categorias}">Ver coleção</a></div>`;
 },
 async dados(box){
  const u=auth.user();
  box.innerHTML=`<form id="fd" style="display:grid;gap:12px"><div><label for="n">Nome</label><input id="n" value="${esc(u.name)}" minlength="2" required></div><div><label for="e">E-mail</label><input id="e" value="${esc(u.email)}" disabled></div><div><label for="t">Telefone</label><input id="t" type="tel" value="${esc(u.phone||'')}"></div><div id="er" class="err" role="alert"></div><button class="btn" type="submit">Salvar</button></form>
  <hr style="border:0;border-top:1px solid var(--line);width:100%"><h2>Alterar senha</h2><form id="fs" style="display:grid;gap:12px">${pw('cp','Senha atual','current-password')}${pw('np','Nova senha','new-password')}<div id="er2" class="err" role="alert"></div><button class="btn sec" type="submit">Alterar senha</button></form>`;
  $('#fd').onsubmit=e=>{e.preventDefault();busy($('#fd button'),$('#er'),async()=>{const d=await auth.call('/api/me',{method:'PUT',body:{name:$('#n').value.trim(),phone:$('#t').value.trim()||null}});auth.setUser(d.user);toast('Dados salvos');$('#hi').textContent=d.user.name})};
  $('#fs').onsubmit=e=>{e.preventDefault();busy($('#fs button'),$('#er2'),async()=>{await auth.call('/api/me/password',{method:'POST',body:{currentPassword:$('#cp').value,newPassword:$('#np').value}});toast('Senha alterada. Entre de novo.');await auth.logout();guest('in')})};
 },
 async enderecos(box){
  box.innerHTML='<div class="empty">Carregando…</div>';
  const draw=async()=>{
   let l=[];try{l=(await auth.call('/api/me/addresses')).addresses}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
   box.innerHTML=`<div>${l.length?l.map(a=>`<div class="ro"><div class="tp"><b>${esc(a.label||'Endereço')}${a.isDefault?' <span class="bd g">padrão</span>':''}</b><button class="lnk" data-del="${a.id}">Excluir</button></div><span style="color:var(--mut)">${esc(a.street)}, ${esc(a.number)}${a.complement?' - '+esc(a.complement):''} · ${esc(a.district||'')} · ${esc(a.city)}/${esc(a.uf)} · CEP ${esc(a.cep)}</span></div>`).join(''):'<div class="empty">Nenhum endereço salvo.</div>'}</div>
   <h2 style="margin-top:8px">Novo endereço</h2><form id="fa" class="f"><div class="w"><label for="lb">Apelido (casa, trabalho…)</label><input id="lb" maxlength="40"></div><div><label for="ce">CEP</label><input id="ce" inputmode="numeric" maxlength="9" required></div><div><label for="nu">Número</label><input id="nu" required></div><div class="w"><label for="ru">Rua</label><input id="ru" required></div><div class="w"><label for="co">Complemento</label><input id="co"></div><div><label for="ba">Bairro</label><input id="ba"></div><div><label for="ci">Cidade</label><input id="ci" required></div><div><label for="uf">UF</label><input id="uf" maxlength="2" style="text-transform:uppercase" required></div><div class="w err" id="er" role="alert"></div><div class="w"><button class="btn" type="submit">Salvar endereço</button></div></form>`;
   $$('[data-del]',box).forEach(b=>b.onclick=async()=>{if(!confirm('Excluir este endereço?'))return;try{await auth.call('/api/me/addresses/'+b.dataset.del,{method:'DELETE'});draw()}catch(e){toast(e.message)}});
   $('#ce').oninput=async e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5,8):v;
    if(v.length===8){try{const r=await fetch(`https://viacep.com.br/ws/${v}/json/`).then(r=>r.json());if(!r.erro){$('#ru').value=r.logradouro||'';$('#ba').value=r.bairro||'';$('#ci').value=r.localidade||'';$('#uf').value=r.uf||'';$('#nu').focus()}}catch{}}};
   $('#fa').onsubmit=e=>{e.preventDefault();busy($('#fa button'),$('#er'),async()=>{await auth.call('/api/me/addresses',{method:'POST',body:{label:$('#lb').value.trim()||undefined,cep:$('#ce').value,street:$('#ru').value.trim(),number:$('#nu').value.trim(),complement:$('#co').value.trim()||undefined,district:$('#ba').value.trim()||undefined,city:$('#ci').value.trim(),uf:$('#uf').value.trim()}});toast('Endereço salvo');draw()})};
  };draw();
 }
};
function home(tab='pedidos'){
 const u=auth.user();if(!u)return guest();
 const T=[['pedidos','Meus pedidos'],['dados','Meus dados'],['enderecos','Endereços']];
 app.innerHTML=`<h1 class="ttl">Olá, <span id="hi">${esc(u.name)}</span></h1><p class="sub">${esc(u.email)}</p><div class="dash"><nav aria-label="Conta">${T.map(([k,l])=>`<button data-t="${k}"${k===tab?' aria-current="page"':''}>${l}</button>`).join('')}<button id="out">Sair</button></nav><div class="card pn" id="pn"></div></div>`;
 $$('[data-t]').forEach(b=>b.onclick=()=>home(b.dataset.t));
 $('#out').onclick=async()=>{await auth.logout();toast('Você saiu');guest()};
 VIEWS[tab]($('#pn'));
}
const rt=new URLSearchParams(location.search).get('reset');
if(rt)reset(rt);else if(auth.logged())home();else guest();
</script>
</body></html>
